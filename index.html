<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comment Section</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="comment-section">
        <div class="comment-form">
            <textarea placeholder="Write a comment..."></textarea>
            <button type="button">Post Comment</button>
        </div>
        <ul class="comments">
            <li class="comment">
                <div class="author">User1</div>
                <div class="text">This is a sample comment.</div>
                <div class="timestamp">2 hours ago</div>
                <ul class="replies">
                    <li class="comment">
                        <div class="author">User2</div>
                        <div class="text">This is a reply to User1's comment.</div>
                        <div class="timestamp">1 hour ago</div>
                        <ul class="replies">
                            <li class="comment">
                                <div class="author">User3</div>
                                <div class="text">This is a reply to User2's reply.</div>
                                <div class="timestamp">30 minutes ago</div>
                            </li>
                        </ul>
                    </li>
                </ul>
            </li>
            <li class="comment">
                <div class="author">User4</div>
                <div class="text">Another top-level comment.</div>
                <div class="timestamp">1 hour ago</div>
            </li>
        </ul>
    </div>

    <div>SOme text</div>
</body>
</html></li>
