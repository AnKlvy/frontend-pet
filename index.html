<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Введите имя</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            background: #111;
        }

        input {
            position: absolute;
            padding: 10px 20px;
            font-size: 18px;
            border: none;
            border-radius: 5px;
            background: #fff;
            color: #000;
            transform: translate(-50%, -50%);
            z-index: 10;
        }

        input:hover {
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.7);
        }
    </style>
</head>
<body>
<input type="text" placeholder="Введите имя" id="floatInput" />

<script>
    const input = document.getElementById('floatInput');

    let x = window.innerWidth / 2;
    let y = window.innerHeight / 2;
    let vx = 0;
    let vy = 0;
    let angle = 0;
    let vAngle = 0;

    let mouseX = x;
    let mouseY = y;

    const fearRadius = 150;
    const repulsionStrength = 0.5;
    const friction = 0.94;
    const angularFriction = 0.9;
    const maxAngularSpeed = 0.1;

    document.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
    });

    function animate() {
        const dx = x - mouseX;
        const dy = y - mouseY;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < fearRadius && dist > 1) {
            const force = (1 - dist / fearRadius) * repulsionStrength;
            const fx = (dx / dist) * force;
            const fy = (dy / dist) * force;

            vx += fx;
            vy += fy;

            const torque = (dx * vy - dy * vx) * 0.001;
            vAngle += torque;
        }

        vx *= friction;
        vy *= friction;
        vAngle *= angularFriction;

        vAngle = -Math.max(-maxAngularSpeed, Math.min(maxAngularSpeed, vAngle));

        x += vx;
        y += vy;
        angle += vAngle;

        const inputRect = input.getBoundingClientRect();
        const halfWidth = inputRect.width / 2;
        const halfHeight = inputRect.height / 2;

        // ограничение по краям с учетом размеров инпута
        x = Math.max(halfWidth, Math.min(window.innerWidth - halfWidth, x));
        y = Math.max(halfHeight, Math.min(window.innerHeight - halfHeight, y));

        input.style.left = `${x}px`;
        input.style.top = `${y}px`;
        input.style.transform = `translate(-50%, -50%) rotate(${angle}rad)`;

        requestAnimationFrame(animate);
    }

    // дождаться полной отрисовки, чтобы корректно считать размеры
    window.addEventListener('load', () => {
        x = window.innerWidth / 2;
        y = window.innerHeight / 2;
        animate();
    });

    window.addEventListener('resize', () => {
        x = Math.min(Math.max(x, input.offsetWidth / 2), window.innerWidth - input.offsetWidth / 2);
        y = Math.min(Math.max(y, input.offsetHeight / 2), window.innerHeight - input.offsetHeight / 2);
    });
</script>
</body>
</html>
